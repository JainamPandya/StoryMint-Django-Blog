{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
<div class="container" style="width: 50%; padding-bottom: 10%;">
<h1 class="text-center">log In</h1>
<form action="{% url 'login' %}" method="POST">
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-warning">Login</button>
</form>
</div>

{% endblock %}
