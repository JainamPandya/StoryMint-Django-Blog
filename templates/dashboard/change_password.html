{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password — StoryMint{% endblock %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h3 class="font-weight-bold mb-0">Change Password</h3>
                <small class="text-muted">Ensure your account uses a strong, unique password</small>
            </div>
            <a href="{% url 'profile_settings' %}" class="btn btn-outline-secondary btn-sm">&larr; Profile Settings</a>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-4 d-flex justify-content-between">
                    <a href="{% url 'dashboard' %}" class="btn btn-light font-weight-bold">Cancel</a>
                    <button type="submit" class="btn btn-warning font-weight-bold px-4">
                        <i class="fa-solid fa-key mr-1"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
