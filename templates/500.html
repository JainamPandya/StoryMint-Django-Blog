{% extends 'base.html' %}

{% block title %}500 — Server Error | StoryMint{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5 py-5">
    <div class="col-lg-7">
        <span class="badge badge-danger p-2 text-uppercase mb-3">Error 500</span>
        <h1 class="display-1 font-weight-bold mb-2" style="font-size: 6rem; letter-spacing: -2px;">500</h1>
        <h3 class="font-weight-bold mb-3">Unexpected System Hiccup</h3>
        <p class="lead text-muted mb-4">
            Something unexpected occurred on our servers while processing your request. Our engineering team has been notified.
        </p>

        <div class="d-flex justify-content-center">
            <a href="{% url 'home' %}" class="btn btn-warning font-weight-bold px-4 py-2 mr-2">
                <i class="fa-solid fa-house mr-1"></i> Return Home
            </a>
            <button onclick="window.location.reload();" class="btn btn-outline-secondary font-weight-bold px-4 py-2">
                <i class="fa-solid fa-rotate-right mr-1"></i> Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
